name: Ada Kuşum Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: 8.9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ada Kuşum
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run Ada Kuşum gameplay unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build Ada Kuşum debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify Ada Kuşum APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Upload Ada Kuşum debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ada-kusum-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
